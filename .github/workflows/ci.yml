name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module graph
        run: go mod verify

      - name: Build
        run: go build -trimpath -v ./...

      - name: Test with race detector
        run: go test ./... -race -count=1 -timeout 300s

      - name: Vet
        run: go vet ./...

  quality:
    name: Format and release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb8f4545f2 # v8.0.0
        with:
          version: v2.5.0
          args: --timeout=5m

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The floor ratchets: raise it when coverage rises, never lower it to
      # make a red build green. It exists to stop regressions, not to certify
      # a number.
      - name: Enforce per-package coverage floors
        run: ./scripts/coverage.sh

  fuzz-seeds:
    name: Fuzz seed corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Every pull request replays the checked-in seed corpus, including the
      # inputs that previously found defects, so a fixed parser bug cannot
      # come back unnoticed. Extended fuzzing is a separate, longer job.
      - name: Replay fuzz corpora
        run: go test ./... -run 'Fuzz' -count=1 -timeout 300s

      - name: Fuzz the parsers briefly
        run: |
          go test ./dag/ -run xxx -fuzz FuzzParseTaskURI -fuzztime 45s
          go test ./dag/ -run xxx -fuzz FuzzParseLocalID -fuzztime 45s
          go test ./internal/cli/ -run xxx -fuzz FuzzJSONRPCDispatch -fuzztime 60s
          go test ./internal/cli/ -run xxx -fuzz FuzzMCPToolCall -fuzztime 60s

  vulnerability-scan:
    name: Reachable vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26.1"
          go-package: ./...
