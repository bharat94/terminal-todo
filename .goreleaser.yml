version: 2
project_name: terminal-todo

before:
  hooks:
    - go mod verify

builds:
  - id: todo
    main: ./cmd/todo
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -buildid=
      - -X github.com/bharat94/terminal-todo/internal/cli.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - todo
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - docs/*.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

homebrew_casks:
  - name: terminal-todo
    ids:
      - todo
    # The tap repository is created and configured by the maintainer. Until
    # then the cask is generated as a release artifact and nothing is pushed,
    # so a missing tap cannot fail a release. Set skip_upload to false once
    # bharat94/homebrew-tap exists and the release token can write to it.
    skip_upload: true
    repository:
      owner: bharat94
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/bharat94/terminal-todo
    description: A durable coordination layer for humans and AI agents
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: true
  prerelease: auto

report_sizes: true
